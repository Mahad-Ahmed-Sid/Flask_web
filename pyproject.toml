[project]
name = "product-inventory"
version = "1.0.0"
description = "A Flask + SQLAlchemy product inventory application."
requires-python = ">=3.10"

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["env", "migrations"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # import sorting
    "B",   # bugbear
    "UP",  # pyupgrade
    "C4",  # comprehensions
    "SIM", # simplifications
]
ignore = [
    "E501",   # line length is handled by the formatter
    "SIM108", # ternaries are not always clearer
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
